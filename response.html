<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Internjin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- Top Bar Role Switcher -->
    
    <div
        style="background: #05070c; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); position: fixed; width: 100%; top: 0; z-index: 101;">
        <div class="container" style="display: flex; justify-content: flex-end; gap: 1rem; font-size: 0.8rem;">
            <a href="/switch_role/student"
                style="color: var(--color-primary); font-weight: bold;">Student</a>
            <span style="color: #2a3b55;">|</span>
            <a href="/switch_role/recruiter"
                style="color: #8892b0; font-weight: normal;">Recruiter</a>
        </div>
    </div>
    

    <header style="top: 35px;" >
        <!-- Offset for top bar only if visible -->
        <div class="container">
            <nav>
                <a href="/" class="logo">
                    <img src="/static/images/logo_full_white.png" alt="Internjin"
                        style="height: 40px;">
                </a>

                <ul class="nav-links">
                    
                    <li><a href="/offers">Offers</a></li>
                    <li><a href="/companies">Companies</a></li>
                    
                </ul>

                <div style="display: flex; gap: 1rem; align-items: center;">
                    

                    
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle">Français ▾</a>
                        <ul class="dropdown-menu">
                            <li><a href="/set_language/fr">Français</a></li>
                            <li><a href="/set_language/en">English</a></li>
                            <li><a href="/set_language/jp">日本語</a></li>
                        </ul>
                    </div>
                    

                    
                    <a href="/login" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.9rem;">Login</a>
                    
                </div>
            </nav>
        </div>
    </header>

    <main>
        
<div class="container page-with-header"
    style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div
        style="background: var(--color-card-bg); padding: 2rem; border-radius: 16px; border: 1px solid var(--color-border); width: 100%; max-width: 400px;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h1>

        
        
        

        <form method="POST" action="/login">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Email</label>
                <input type="email" name="email" required
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); background: rgba(255,255,255,0.05); color: white;">
            </div>

            <div style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" required
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); background: rgba(255,255,255,0.05); color: white;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #8892b0;">
            Don't have an account? <a href="/register" style="color: var(--color-primary);">Sign up</a>
        </p>
    </div>
</div>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Internjin. Connecting France & Japan.</p>
        </div>
    </footer>
</body>

</html>
